name: daily-job-discovery
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python discover_jobs.py
      - run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add candidates.json state.json
          git commit -m "daily candidates" || echo "no changes"
          git push
